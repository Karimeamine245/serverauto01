name: Auto Update CCcam Lines

on:
  schedule:
    - cron: '0 * * * *' # Exécution toutes les heures
  workflow_dispatch: # Permet un lancement manuel depuis GitHub

permissions:
  contents: write

jobs:
  update-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: |
          python grabber.py

     - name: Commit et Push automatiques des nouvelles lignes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. On récupère d'abord les changements distants proprement en mode rebase
          git pull --rebase origin main || echo "Aucun rebase nécessaire"
          
          # 2. On ajoute le fichier modifié par le script
          git add "Oscam line Grab"
          
          # 3. On valide s'il y a des changements (évite l'erreur si le fichier est identique)
          git diff --staged --quiet || git commit -m "Mise à jour automatique des lignes [skip ci]"
          
          # 4. On pousse le tout vers GitHub
          git push origin main
