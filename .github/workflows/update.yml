name: Auto Update CCcam Lines

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: |
          python grabber.py

      - name: Commit et Push automatiques des nouvelles lignes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # On ajoute directement le fichier généré par le script
          git add "Oscam line Grab"
          
          # On valide les changements localement
          git commit -m "Mise à jour automatique des lignes [skip ci]" || echo "Aucun changement"
          
          # On récupère les éventuels écarts distants sans conflit de stash
          git pull origin main --rebase --autostash || true
          
          # On pousse proprement sur la branche main
          git push origin main
