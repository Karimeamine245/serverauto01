name: Auto Update CCcam Lines

on:
  schedule:
    - cron: '0 * * * *' # Exécution toutes les heures
  workflow_dispatch: # Permet un lancement manuel depuis GitHub

permissions:
  contents: write

jobs:
  update-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: |
          python grabber.py

      - name: Commit et Push automatiques des nouvelles lignes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        
        # 1. On ajoute d'abord le fichier modifié par le script Python
        git add "Oscam line Grab"
        
        # 2. On valide localement (commit) s'il y a des changements
        git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des lignes [skip ci]"
        
        # 3. On récupère les modifications distantes en mode rebase proprement
        git pull origin main --rebase || true
        
        # 4. On pousse le tout vers GitHub
        git push origin main
