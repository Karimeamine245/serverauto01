name: Auto Update CCcam Lines

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: |
          python grabber.py

      - name: Commit et Push automatiques des nouvelles lignes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour automatique des lignes [skip ci]"
          file_pattern: "Oscam line Grab"
          branch: main
