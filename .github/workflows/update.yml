name: Auto Update CCcam Lines

on:
  schedule:
    # S'exécute automatiquement toutes les heures (à la minute 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permet aussi de lancer manuellement en cas de besoin

jobs:
  update-lines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: python grabber.py

      - name: Commit et Push automatiques des nouvelles lignes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Oscam line Grab"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique (toutes les heures) [skip ci]" && git push)
