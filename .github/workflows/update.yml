name: Auto Update CCcam Lines

on:
  schedule:
    - cron: '0 * * * *' # Exécution toutes les heures
  workflow_dispatch: # Permet un lancement manuel depuis GitHub

permissions:
  contents: write

jobs:
  update-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: |
          python grabber.py

      - name: Commit et Push automatiques des nouvelles lignes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        
        # 1. On ajoute et on valide les modifications du script en PREMIER
        git add "Oscam line Grab"
        git commit -m "Mise à jour automatique des lignes [skip ci]" || echo "Rien à commiter"
        
        # 2. On récupère les changements distants ensuite
        git pull origin main --rebase || true
        
        # 3. On pousse vers GitHub
        git push origin main
