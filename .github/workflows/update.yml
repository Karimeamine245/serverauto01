name: Auto Update CCcam Lines

on:
  schedule:
    - cron: '0 * * * *' # Exécution toutes les heures
  workflow_dispatch: # Permet un lancement manuel depuis GitHub

permissions:
  contents: write

jobs:
  update-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution du script de récupération
        run: |
          python grabber.py

      - name: Commit et Push automatiques des nouvelles lignes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # 1. On met de côté les modifications locales pour repartir sur une base propre
          git stash
          
          # 2. On récupère les derniers changements du dépôt distant
          git pull origin main --rebase || true
          
          # 3. On réapplique nos modifications locales
          git stash pop || true
          
          # 4. On ajoute et valide le fichier mis à jour par le script
          git add "Oscam line Grab"
          git commit -m "Mise à jour automatique des lignes [skip ci]" || echo "Rien à commiter"
          
          # 5. On envoie les modifications sur GitHub sans erreur de rejet
          git push origin main
